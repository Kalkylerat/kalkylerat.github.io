# Deep Space Log marka sistemi: bütün görseller (sahne, kapak, yazı katmanları, banner) bu dosyadan beslenir.
# Sahibinin göndereceği referanslarla doldurulacak (9 Kasım 2026: "tüm görsellerde aynı palet").
# Renkler: arka -> en koyu zemin, gölge -> ikinci koyu, ana -> markanın ana rengi, vurgu -> az kullanılan ışık,
# yazi -> başlık rengi, yazi_ikincil -> alt satırlar.

durum = "taslak"   # film tonu seçildi (bal_kehribar, hafif); görsel kaynağı kararı bekleniyor

[palet]
arka = "#05070f"
golge = "#121a2e"
ana = "#3d6fb8"
vurgu = "#e8c48a"
yazi = "#f0f0f5"
yazi_ikincil = "#b8c0d0"

[filtre]
# Kanalın imza film tonu (sinema LUT'u, renk.py): bütün videolara, kapaklara, Shorts'a ve banner'a uygulanır.
# secim: renk.SECENEKLER'den biri (altin_saat, bal_kehribar, eski_film, kum_altini, sari_camgobegi). Boşken uygulanmaz.
# İnce ayar için seçenekteki bir alan burada ezilebilir (ör. guc = 0.8, doygunluk = 0.9).
secim = "bal_kehribar"   # 9 Kasım 2026, sahibi: "2 ama biraz daha hafif"
guc = 0.55

[yazi]
baslik_font = "Inter-ExtraBold"
govde_font = "Inter-Medium"

[gorsel]
# Görsel konsept (9 Kasım 2026, sahibinin YouTube referansları: dev gezegen altında karlı dağlarda tren; buğday
# tarlasında toprak yolda yürüyen astronot): TANIDIK, Dünya'ya benzeyen sakin bir manzara + gökyüzünü kaplayan
# İMKÂNSIZ büyüklükte gerçek bir gök cismi + ön planda küçük bir HİKÂYE unsuru (yolcu, astronot, tren, kulübe,
# deniz feneri, araba). Fotogerçekçi ama rüya gibi; altın saat ışığı, pus, okra ve soluk camgöbeği.
# Önceki onay (gözlem güvertesi, akış G9Slu7mLp7MkDCxTUyPp) ikincil kullanım: iç mekân sahnesi gerekirse.
# Rengi model değil [filtre] belirler (bal_kehribar); istemdeki tonlar yalnızca ışık yönü içindir.
model = "flux-3-image"
stil_eki = "Surreal yet photorealistic cinematic matte painting. A calm, familiar Earth-like landscape under an impossible sky dominated by a colossal celestial body that fills a large part of the frame. One small human element in the foreground tells a quiet story. Golden hour light, soft atmospheric haze, muted teal sky and warm ochre ground, gentle film grain, ultra detailed, realistic textures and scale, wide 16:9 composition. No text, no logo, no watermark."
yasaklar = ["neon pink", "purple gradient", "lens flare overload", "emoji", "text in image", "watermark"]
