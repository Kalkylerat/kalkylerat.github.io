# Deep Space Log marka sistemi: bütün görseller (sahne, kapak, yazı katmanları, banner) bu dosyadan beslenir.
# Sahibinin göndereceği referanslarla doldurulacak (9 Kasım 2026: "tüm görsellerde aynı palet").
# Renkler: arka -> en koyu zemin, gölge -> ikinci koyu, ana -> markanın ana rengi, vurgu -> az kullanılan ışık,
# yazi -> başlık rengi, yazi_ikincil -> alt satırlar.

durum = "taslak"   # film tonu seçildi (bal_kehribar, hafif); görsel kaynağı kararı bekleniyor

[palet]
arka = "#05070f"
golge = "#121a2e"
ana = "#3d6fb8"
vurgu = "#e8c48a"
yazi = "#f0f0f5"
yazi_ikincil = "#b8c0d0"

[filtre]
# Kanalın imza film tonu (sinema LUT'u, renk.py): bütün videolara, kapaklara, Shorts'a ve banner'a uygulanır.
# secim: renk.SECENEKLER'den biri (altin_saat, bal_kehribar, eski_film, kum_altini, sari_camgobegi). Boşken uygulanmaz.
# İnce ayar için seçenekteki bir alan burada ezilebilir (ör. guc = 0.8, doygunluk = 0.9).
secim = "bal_kehribar"   # 9 Kasım 2026, sahibi: "2 ama biraz daha hafif"
guc = 0.55

[yazi]
baslik_font = "Inter-ExtraBold"
govde_font = "Inter-Medium"

[gorsel]
# Onaylı referans (9 Kasım 2026, sahibi "referans 1 güzel"): ElevenLabs akışı G9Slu7mLp7MkDCxTUyPp, üretim
# QlZuTQFS4fs5WbM2cA9t (FLUX 3). Yön: fotogerçekçi sinema karesi, dramatik ve hikâyeli; gerçek bir gök cismi +
# küçük bir insan izi (astronot, araç, istasyon, PROBE-7) + yalnızlık ve uzun yolculuk duygusu.
# Renk tonunu görsel modeli değil [filtre] belirler; istem nötr-sıcak kalır ki LUT her görselde aynı sonucu versin.
model = "flux-3-image"
stil_eki = "Photorealistic cinematic film still, dramatic and story-driven, a small human presence against a vast real celestial world, quiet and lonely mood of a long voyage. Shot on ARRI Alexa 65 with anamorphic lens, shallow depth of field, volumetric light, dust in light beams, subtle film grain, high dynamic range, ultra detailed, realistic materials and scale. No text, no logo, no watermark."
yasaklar = ["neon pink", "purple gradient", "lens flare overload", "emoji", "text in image", "watermark"]
