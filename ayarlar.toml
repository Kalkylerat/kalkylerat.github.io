# Bot ayarları. GitHub web arayüzünden bu dosyayı düzenleyip kaydetmeniz yeterli.

[genel]
saat_dilimi = "Europe/Stockholm"

[konsept]
# "analiz": kupon, stake ve kasa yok; her gün maç analizi kartları (olasılıklar, skor dağılımı).
# "kupon": eski düzen (kupon + sanal kasa).
mod = "analiz"

[ligler]
# API-Football lig ID'leri; sıra önceliktir (günlük tarama sınırı dolarsa sondakiler atlanır).
# Sadece takım istatistiği ve güvenilir oranı olan maçlar seçilir.
izinli = [
  39, 140, 135, 78, 61,        # Premier League, La Liga, Serie A, Bundesliga, Ligue 1
  2, 3, 848, 5,                # Şampiyonlar Ligi, Avrupa Ligi, Konferans Ligi, Nations League
  40, 79, 136, 141, 62,        # Championship, 2. Bundesliga, Serie B, La Liga 2, Ligue 2
  88, 94, 144, 179, 203,       # Eredivisie, Portekiz, Belçika, İskoçya, Süper Lig
  113, 103, 119, 218, 207,     # Allsvenskan, Norveç, Danimarka, Avusturya, İsviçre
  41, 89, 204, 219, 114,       # League One, Eerste Divisie, TFF 1. Lig, Avusturya 2. Liga, Superettan
]
# İki aşamalı tarama: 1) günün bütün maçlarının oranları toplu çekilir (istek başına 10 maç),
# 2) yalnızca piyasaya göre umut vadeden maçlar için istatistik istenir.
# tum_ligler: izinli liste dışındaki ligler de taranır; bu liglerde oyun ancak keskin bahisçi (Pinnacle)
# o pazarı fiyatlıyorsa, Bet365 ve en az 3 büyük sitede oran varsa ve takım istatistiği yeterliyse seçilir.
tum_ligler = true
# Toplu oran taramasında en fazla kaç sayfa (her sayfa 1 istek, 10 maç). Ücretsiz plan en fazla 3 sayfaya izin
# veriyor; kalan maçların oranı hak yettiğince tek tek çekilir. Pro plan: 100+.
max_oran_sayfasi = 30
# Detaylı incelenecek en fazla maç sayısı (her biri 1 istatistik + gerekirse 1 sakat listesi isteği).
max_detay_mac = 30
# Toplu tarama çalışmazsa eski yöntem: izinli liglerden en fazla kaç maç (maç başına 2 istek).
max_mac_tarama = 150
# İstekler arası bekleme (sn). Ücretsiz plan dakikada 10 istek: 6.5. Pro plan (şu an): 0.3.
istek_araligi_sn = 0.3

[strateji]
# Günde en fazla kaç oyun, bir maçtan en fazla kaç oyun ve en fazla kaç kupon (X Direktörü haftalık stratejide
# günlük kupon sınırını 1-3 arasında belirler; o varsa bu değer yerine o kullanılır).
# Kupon: tek maç ya da 2-3 maçlık kombine; her kupon kasanın oyun_yuzdesi kadarıyla oynanır.
max_oyun = 7
max_oyun_mac_basina = 2
max_kupon = 2
# YÜKSEK İHTİMALLİ oyun: en az %65 kazanma ihtimali (keskin piyasanın marjsız fiyatından) VE oran adil fiyata
# yakın: en fazla %4 altında (normal bahisçi marjı kadar). Öncelik her gün güvenilir, sık tutan bir kupon;
# adil fiyatın çok altındaki (marjı yüksek) oranlar alınmaz. Kasayı asıl büyüten değer oyunlarıdır.
guvenli_min_olasilik = 0.65
guvenli_min_deger = -0.04
# DEĞER oyunu (kasayı büyüten): oran gerçek ihtimalden en az %3 yüksek, ihtimal en az %45.
deger_min_olasilik = 0.45
deger_min_deger = 0.03
oran_min = 1.20
oran_max = 2.60
# Gol modeli (Poisson) adil olasılıktan bu kadar düşükse oyuna güvenilmez.
model_tolerans = 0.08
# Maça bu kadar dakikadan az kaldıysa oyuna alınmaz (takipçinin oynamaya vakti olsun: 2,5 saat).
min_dakika_once = 150

# Kupon oranı = ayakların oranlarının çarpımı, gerçek ihtimal = ihtimallerin çarpımı.

[kasa]
# Sanal kasa: her kupona güncel kasanın bu yüzdesi yatırılır.
baslangic = 10000
oyun_yuzdesi = 1.0
para_birimi = "€"

[bahisciler]
# "Adil" olasılık için referans alınan keskin bahisçi. Yoksa en az 3 bahisçinin ortalaması kullanılır.
keskin = "Pinnacle"
# Keskin bahisçinin fiyatlamadığı pazarlarda ihtimal daha az güvenilir: değer sınırları bu kadar sıkılaşır
# (yüksek ihtimalli oyunda %0 yerine +%3, değer oyununda +%3 yerine +%6).
keskinsiz_ek_marj = 0.03
# Oranın alınacağı büyük bahisçiler. Tweetlerde bahisçi adı yazılmaz.
oran_bahiscileri = ["Bet365", "William Hill", "Betano", "BetVictor", "Unibet", "Betway", "888Sport", "Bwin", "Betsson", "NordicBet", "ComeOn"]
# "en_iyi": bu sitelerdeki en yüksek fiyat (takipçi o sitede bulabilir; değer bahsinin standart yöntemi).
# "medyan": ortanca fiyat (daha tutucu; yüksek ihtimalli oyunlarda adil fiyatı neredeyse hiç geçmez).
oran_yontemi = "en_iyi"
# Takipçinin bulabileceği pazar: bu listede en az bu kadar sitede oran olmalı ve zorunlu siteler mutlaka olmalı.
min_oran_bahiscisi = 3
zorunlu_bahisciler = ["Bet365"]

[claude]
model = "claude-opus-5-5"
effort = "high"

[yayin]
# false: oyunlar taslak olarak kaydedilir, siz "yayinla" komutunu çalıştırınca paylaşılır.
# true: oyunlar hazırlanır hazırlanmaz X'te paylaşılır.
otomatik_paylas = true
# true: kupon önce GitHub'da önizlemeli bir onay isteği (issue) olarak gelir. "ok" → hemen paylaşılır,
# "iptal" → paylaşılmaz, cevap yoksa onay_suresi_dk sonra (en geç ilk maçtan 2 saat önce) otomatik paylaşılır.
onay_bekle = true
onay_suresi_dk = 90

[yogun]
# Yoğun günler (maç dolu günler): postlar arası aralik_dk dakika (normalde 45), öne çıkan kart sayısı "kart"a kadar
# genişler; büyük liglerin yanında ek_ligler'in maçları da kart alır (ör. akşam Arjantin/Brezilya maçları).
# Her post farklı bir maçın analizi ya da maç sonu: aynı içerik tekrar edilmez (X spam kuralı).
gunler = []
hafta_sonu = true  # Cumartesi ve Pazar bütün gün maç var: her zaman yoğun
# Yoğun günde ~15 dakikada bir post (nabız 7 dakikada bir: aralık 13 → pratikte 14 dk; normal gün 45), günde en
# fazla 40 post (maç sonu ve tablo yanıtları hariç; hepsi birlikte X API'nin günlük 100 post sınırının altında kalır).
# Her post farklı bir maç: aynı metin iki kez gitmez (X spam kuralı).
aralik_dk = 13
gunluk_sinir = 40
kart = 30
ek_ligler = [128, 71, 239, 253, 262, 479]  # Arjantin, Brezilya Serie A, Kolombiya, MLS, Liga MX, Kanada

[alarm]
# Bir post kaçınca, durunca ya da hata verince GitHub'da "alarm" etiketli issue açılır ve bu kullanıcı etiketlenir
# (e-posta ve GitHub mobil bildirimi gelir). Boş bırakılırsa alarm kapalı.
kime = "Kalkylerat-desk"

[topluluk]
# X Topluluğu (Communities): küçük hesaplar için en etkili erişim yolu. Hesapla bir futbol/istatistik topluluğuna
# katılın, adresindeki numarayı (x.com/i/communities/NUMARA) buraya yazın. Tablo, oran/istatistik ve kart postları
# toplulukta da paylaşılır (takipçilere de görünür). Boşsa kapalı. Gönderim hata verirse normal post atılır.
id = ""

[direktor]
# X Direktörü: kupon dışı paylaşımların metnini yazar (günlük, hızlı model) ve her Pazartesi hesabın
# etkileşim rakamlarını inceleyip haftanın stratejisini ve sahibine Türkçe raporu hazırlar (en güçlü model).
# Model erişilemezse ya da metin kurallara uymazsa şablon metin paylaşılır; X otomasyon kuralları kodda sabittir.
aktif = true
gunluk_model = "claude-sonnet-5-5"
gunluk_effort = "medium"
strateji_model = "claude-fable-5-1"
strateji_effort = "high"

[likely]
# Mr. Likely: elle paylaşılan ikinci hesap (tahmin/kupon). Bot X'e hiçbir şey paylaşmaz: her sabah adayları ve hazır
# kuponları GitHub issue'su olarak gönderir, sahibi yorumla seçer ("C", "3 7 12", "pas"), post metni yoruma gelir,
# postu sahibi elle atar. Sonuç postunun taslağı ve karne maçlar bitince aynı issue'ya gelir. Ek API isteği yok.
aktif = true
# "otomatik": kuponu aşağıdaki sabit kurallar seçer ve bot Mr. Likely hesabında paylaşır (hesap X'te "Automated"
# etiketli olmalı; GitHub'da X_LIKELY_API_KEY, X_LIKELY_API_SECRET, X_LIKELY_ACCESS_TOKEN, X_LIKELY_ACCESS_SECRET).
# "elle": bot paylaşmaz; taslak GitHub'a gelir, sahibi seçer ve postu kendisi atar.
mod = "otomatik"
# Otomatik kupon kuralları (SOZLESME E6). Günde en fazla kaç kupon, kuponda en fazla kaç maç.
oto_max_kupon = 2
oto_max_ayak = 4
# Kuponun toplam oranı bu aralıkta olur (sahibinin kararı): daha riskli, daha yüksek oranlı kuponlar.
oto_oran_min = 2.0
oto_oran_max = 4.0
# Ayak: sağlam adayın en düşük kazanma ihtimali; oranı adil fiyatın en fazla bu kadar altında.
oto_min_ayak = 0.65
oto_min_deger = -0.04
# Kuponun en düşük tutma ihtimali. Aralıktaki kuponlar içinde tutma ihtimali en yüksek olan seçilir.
oto_min_tutma = 0.30
# Kuponun toplam fiyatı adil fiyatın en fazla bu kadar altında olabilir (her maçta bahisçi payı birikir).
oto_min_kupon_deger = -0.08
# Kupon ilk maçtan en erken kaç dakika önce paylaşılır; ilk maça bundan az kaldıysa paylaşılmaz.
oto_once_dk = 180
oto_son_dk = 20
# Günün dersi (kupon stratejisi notu) bu saatten sonra (İsveç saati), kupon postlarından uzakta paylaşılır.
oto_ders_saati = 14
# Havuza girmek için en düşük kazanma ihtimali (keskin piyasanın marjsız fiyatı) ve "80+" etiketinin sınırı.
min_olasilik = 0.65
yuksek_olasilik = 0.80
# Oran adil fiyatın en fazla bu kadar altında olabilir (bahisçi payı): daha pahalı oyunlar havuza girmez.
min_deger = -0.05
oran_min = 1.10
oran_max = 2.60
# En fazla kaç aday ve kaç hazır kupon; maça en az kaç dakika kalmış olmalı (seçip paylaşmaya vakit).
havuz = 30
kupon = 10
min_dakika_once = 120
# Kendi kurduğun kuponda en fazla maç sayısı.
max_ayak = 4
