# Bot ayarları. GitHub web arayüzünden bu dosyayı düzenleyip kaydetmeniz yeterli.

[genel]
saat_dilimi = "Europe/Stockholm"

[ligler]
# API-Football lig ID'leri. Sıra önceliği belirler (ücretsiz planda ilk ligler taranır).
# 113 Allsvenskan, 39 Premier League, 114 Superettan, 40 Championship, 140 La Liga, 135 Serie A,
# 78 Bundesliga, 61 Ligue 1, 2 Şampiyonlar Ligi, 3 Avrupa Ligi, 848 Konferans Ligi,
# 103 Eliteserien (Norveç), 119 Superliga (Danimarka), 88 Eredivisie, 5 UEFA Nations League (milli maç araları)
izinli = [113, 39, 2, 3, 848, 5, 114, 40, 140, 135, 78, 61, 103, 119, 88]
# Günlük en fazla kaç maç analiz edilsin. Ücretsiz API-Football planı (100 istek/gün) için 60 civarı kalın.
max_mac_tarama = 60

[spel]
# Günlük en fazla kaç tekli (singel) oyun. Uygun oyun yoksa o gün paylaşım yapılmaz.
max_spel = 3
# Strateji: en yüksek kazanma ihtimali. Bu ihtimalin altındaki oyunlar aday olmaz (0.65 = %65).
min_olasilik = 0.65
# Önerilen oranın aralığı. Yüksek ihtimal = düşük oran.
oran_min = 1.20
oran_max = 1.75
# Bahisçinin oranı adil fiyattan en fazla bu kadar kötü olabilir (-0.05 = en fazla %5 kötü).
# Daha kötüyse oyun elenir; böylece "çok tutan ama çok kaybettiren" oyunlar alınmaz.
min_deger = -0.05
# Gol modeli (Poisson) adil olasılıktan bu kadar düşükse oyuna güvenilmez.
model_tolerans = 0.06
# Maça bu kadar dakikadan az kaldıysa oyuna alınmaz.
min_dakika_once = 60

[bahisciler]
# "Adil" olasılık için referans alınan keskin (sharp) bahisçi. Yoksa tüm bahisçilerin ortalaması kullanılır.
keskin = "Pinnacle"
# Oranı önerilen, İsveç lisanslı bahisçiler (API-Football'daki adlarıyla).
# Lisansları spelinspektionen.se üzerindeki licensregister'dan kontrol edin.
isvec_lisansli = ["Unibet", "Betsson", "NordicBet", "Bet365", "ComeOn", "Betway", "888Sport", "Expekt"]

[claude]
model = "claude-opus-5-5"
effort = "high"

[yayin]
# false: oyunlar taslak olarak kaydedilir, siz "Yayınla" iş akışını çalıştırınca paylaşılır.
# true: oyunlar hazırlanır hazırlanmaz X'te paylaşılır.
otomatik_paylas = false
