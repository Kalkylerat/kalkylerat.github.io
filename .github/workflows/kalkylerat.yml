name: Kalkylerat Botu

on:
  schedule:
    # Günün analizi her gün sabah erken: Asya/Okyanusya'daki öğle maçları (ör. Japonya) da kart alsın.
    # Tam saat yerine :17 = GitHub'ın yoğun saatinde gecikme azalır. Atlanırsa nabız gün içinde tamamlar.
    - cron: "17 5 * * *"   # 07:17 İsveç yaz saati (kışın 06:17); config.SABAH_YEREL_DK ile aynı
    # Nabız, 15 dakikada bir (nöbetçi ayrıca 7 dakikada bir başlatır): sıradaki analiz postu, maç sonu postları,
    # Mr. Likely ve Tiny Fixes işleri. API isteği yalnızca bitmiş olması gereken maçlar için.
    - cron: "7,22,37,52 * * * *"  # çeyrek başları GitHub'ın en yoğun anı, gecikmesin
  issue_comment:
    types: [created]  # Mr. Likely paketine sahibinin cevabı (kupon seçimi, "iptal")
  workflow_dispatch:
    inputs:
      komut:
        description: "Ne yapılsın?"
        type: choice
        default: nabiz
        options: [nabiz, otomatik, panel, tani, profil, oran_testi, onay_kontrol, odds_tani, odds_pazar, vitrin, af_pazar, direktor, temizle, liste, kiyas, takip_yenile, metrik, hesap_kontrol, likely, likely_paket, likely_yetki, likely_ek, likely_yenile, likely_iptal, flood, flood_yetki, flood_ig, flood_tani, flood_paket, flood_site]
      ek:
        description: "Tek çalışmalık istisna (ör. deger_min_deger=0.02), likely_iptal için kupon adı ya da likely_yetki için dönülen adres; boş bırakın"
        type: string
        default: ""

permissions:
  contents: write
  issues: write


jobs:
  calistir:
    # Yorumlarda yalnızca Mr. Likely paketlerine, sahibinin/üyenin/ortağın yorumlarında tepki verilir
    # (yabancı yorumlar sıradaki işleri iptal edemesin).
    if: >-
      github.event_name != 'issue_comment' ||
      (contains(github.event.issue.labels.*.name, 'mr-likely') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04  # sabit sürüm: ubuntu-latest havuzu 5 Ekim akşamı iş almadı
    # İş düzeyinde: atlanan işler (yabancı yorumlar) sıradaki çalışmayı iptal edemez.
    concurrency:
      group: kalkylerat-botu
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Sırada bekleyen çalışma, tetiklendiği andaki değil en güncel kayıtla başlamalı.
      - run: git pull --ff-only origin "$GITHUB_REF_NAME"
      - run: pip install -r requirements.txt
      # Testler çalışma alanında iz bırakmasın.
      - run: python -m pytest -q
      - run: git checkout -- docs
      - name: Botu çalıştır
        env:
          OLAY: ${{ github.event_name }}
          ZAMAN: ${{ github.event.schedule }}
          SECIM: ${{ inputs.komut }}
          BOT_EK: ${{ inputs.ek }}
          GH_TOKEN: ${{ github.token }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          # Mr. Likely hesabı (otomatik mod); yoksa bot yalnızca taslak hazırlar.
          X_LIKELY_API_KEY: ${{ secrets.X_LIKELY_API_KEY }}
          X_LIKELY_API_SECRET: ${{ secrets.X_LIKELY_API_SECRET }}
          X_LIKELY_ACCESS_TOKEN: ${{ secrets.X_LIKELY_ACCESS_TOKEN }}
          X_LIKELY_ACCESS_SECRET: ${{ secrets.X_LIKELY_ACCESS_SECRET }}
          # Tiny Fixes (üçüncü hesap, SOZLESME F): X izni data/flood_x.enc içinde şifreli; Instagram anahtarı ve kimliği
          # yalnızca ilk kurulumda gerekir (flood_ig komutu şifreli kaydeder). [flood] mod = "kapali" iken hiçbiri okunmaz.
          IG_FLOOD_TOKEN: ${{ secrets.IG_FLOOD_TOKEN }}
          IG_FLOOD_ID: ${{ secrets.IG_FLOOD_ID }}
          # Tiny Fixes gelir rakamları (yalnızca okuma, F14); yoksa haftalık rapor "okunmadı" yazar.
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          LEMON_API_KEY: ${{ secrets.LEMON_API_KEY }}
        run: |
          case "$OLAY|$ZAMAN" in
            issue_comment\|*) KOMUT=onay_kontrol ;;
            "schedule|7,22,37,52 * * * *") KOMUT=nabiz ;;
            schedule\|*) KOMUT=otomatik ;;
            *) KOMUT="$SECIM" ;;
          esac
          echo "Komut: $KOMUT"
          if [ -z "$API_FOOTBALL_KEY" ] || [ -z "$X_ACCESS_TOKEN" ]; then
            echo "Anahtarlar henüz eklenmemiş (README > Kurulum). Bot çalıştırılmadı." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m bot "$KOMUT"
      - name: Kaydı depoya işle
        if: always()
        run: |
          git config user.name "kalkylerat-botu"
          git config user.email "kalkylerat-botu@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Spel-kaydı $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Tweetler atıldı; kayıt kaybolursa ertesi gün tekrar paylaşım olur. Bu yüzden push mutlaka başarmalı.
          for i in 1 2 3 4 5; do
            # Çakışmada bu çalışmanın kaydı (en güncel olan) korunur.
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "::error::Kayıt depoya gönderilemedi! Çalışmanın 'kayit' dosyasından geri yüklenmeli."
          exit 1
      - name: Tiny Fixes paketlerini kısa ömürlü çıktı olarak sakla (depoya girmez, F13)
        if: always() && hashFiles('urun/*.pdf') != ''
        uses: actions/upload-artifact@v4
        with:
          name: tiny-fixes-paketler
          path: urun/*.pdf
          retention-days: 1
      - name: Kayıt yedeği (push başarısız olursa)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kayit
          path: |
            data/
            docs/
