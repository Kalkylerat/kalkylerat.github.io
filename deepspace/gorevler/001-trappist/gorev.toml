[Beacon Echo | 2:10-3:20 | tape-warped piano plays D-A-E, distant, like a memory of the first signal]
[Ancient Light | 3:20-4:50 | distant organ joins, pad morphs slowly]
[Echo Again | 4:50-6:00 | motif once more, slower, more reverb]
[Dissolve | 6:00-7:00 | everything thins to sine drone and static]
[Outro | 7:00-8:00 | Dsus2 held, very long fade to silence]"""
