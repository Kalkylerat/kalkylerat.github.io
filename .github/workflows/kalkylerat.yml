name: Kalkylerat Botu

on:
  schedule:
    - cron: "0 8 * * *"    # 10:00 İsveç (yaz saati): dünkü sonuçlar + günün oyunları
    - cron: "30 21 * * *"  # 23:30 İsveç (yaz saati): akşam maçlarının sonuçları
  workflow_dispatch:
    inputs:
      komut:
        description: "Ne yapılsın?"
        type: choice
        default: yayinla
        options: [yayinla, onizleme, duzelt, sabit, otomatik, tahmin, sonuc, panel, tani]

permissions:
  contents: write

concurrency:
  group: kalkylerat-botu
  cancel-in-progress: false

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Botu çalıştır
        env:
          KOMUT: ${{ github.event.schedule == '30 21 * * *' && 'sonuc' || inputs.komut || 'otomatik' }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          if [ -z "$API_FOOTBALL_KEY" ] || [ -z "$X_ACCESS_TOKEN" ]; then
            echo "Anahtarlar henüz eklenmemiş (README > Kurulum). Bot çalıştırılmadı." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m bot "$KOMUT"
      - name: Kaydı depoya işle
        if: always()
        run: |
          git config user.name "kalkylerat-botu"
          git config user.email "kalkylerat-botu@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Spel-kaydı $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
