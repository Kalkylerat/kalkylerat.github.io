# Deep Space Log marka sistemi: bütün görseller (sahne, kapak, yazı katmanları, banner) bu dosyadan beslenir.
# Kit dosyaları deepspace/marka/ altında (banner, profil, filigran, marka kitabı, kaynak/A2.png). Kit ya da bu dosya
# değişirse marka istasyonu yeniden denetlenir ve sahibinin onayı yenilenir (G16).
# Renkler: arka -> en koyu zemin, gölge -> ikinci koyu, ana -> markanın ana rengi, vurgu -> az kullanılan ışık,
# yazi -> başlık rengi, yazi_ikincil -> alt satırlar.

durum = "denetimde"   # 11 Kasım 2026: sahibi taslağı onayladı (renk A bize bırakıldı); kesin kayıt denetçi GEÇTİ'den sonra `gorev marka --onay` ile

[palet]
arka = "#05070f"
golge = "#121a2e"
ana = "#3d6fb8"
vurgu = "#e8c48a"
yazi = "#f0f0f5"
yazi_ikincil = "#b8c0d0"

[filtre]
# Kanalın imza film tonu (sinema LUT'u, renk.py): bütün videolara, kapaklara, Shorts'a ve banner'a uygulanır.
# secim: renk.SECENEKLER'den biri (altin_saat, bal_kehribar, eski_film, kum_altini, sari_camgobegi). Boşken uygulanmaz.
# İnce ayar için seçenekteki bir alan burada ezilebilir (ör. guc = 0.8, doygunluk = 0.9).
secim = ""   # 11 Kasım 2026: A (tonsuz). Kehribar yalnız vurgu rengi olarak kalır. Önceki: bal_kehribar, guc 0.55

[yazi]
baslik_font = "SpaceMono-Bold"     # deepspace/font (OFL)
govde_font = "SpaceMono-Regular"

[sablon]
# Şablon yazı boyutları (piksel, kendi karesinde). Telefon kuralı: en küçük yazı kare yüksekliğinin %2'si (G16).
# Kapak 1280x720: sahnenin küçültülmüş hâli, harf aralıklı başlık, kehribar çizgi ve etiket (düzen: kapak.py).
kapak_baslik = 70
kapak_etiket = 22
# Short 1080x1920: kanca y=0.28H, sinyal y>0.8H.
short_kanca = 64
short_etiket = 40

[gorsel]
# Görsel dili: kurallar .claude/skills/gorsel-dili/SKILL.md (12 Kasım 2026). Karanlık, durgun bir yabancı ufuk ya da
# yörüngeden görünüm ve TEK büyük gerçek gök cismi. Sahnede insan, araç, sonda, bina, iz yok; PROBE-7 yalnız
# arayüzde. Her sahne uzayda; ışık fiziği doğru (G13).
model = "gpt-image-2"  # 12 Kasım 2026 pilotu: FLUX zemini gri, ışığı soğuk bırakıyordu; son hâl Topaz 2x (topaz-image-upscale-v2)
stil_eki = "Raw spacecraft photograph, low-key exposure, restrained natural colour, deep black sky with pin-sharp stars, calm and still, wide 16:9. No people, no vehicles, no probes, no buildings, no text."
yasaklar = ["neon pink", "purple gradient", "lens flare overload", "emoji", "text in image", "watermark"]

[gorsel.kadraj_eki]  # 12 Kasım 2026 (G6): kadraja göre kısa ek; sahne istemi + kadraj eki + stil_eki
ufuk = "Seen from just above a bare surface: the ground is matte and nearly black, catching thin rims of starlight only on the edges that face the light."
yorunge = "Seen from orbit: a single world off-centre, part lit by its star and part in pure black night, surrounded by empty black space."
derin = "Pure deep space, the whole frame is open sky: a dense field of faint stars, a faint glow of starlight around the star."

[hareket]
# Görseli videoya çeviren yapay zekâ klibi (image-to-video). Klip gorsel/NN.mp4 olarak konur; hat onu dikişsiz döngüye
# çevirir (klip.py), 4K'ya ölçekler, marka tonunu uygular. Klip yoksa görselden canlı tablo (tablo.py) yapılır.
# Döngü için başlangıç ve bitiş karesine AYNI görsel verilir. Kamera sabit; yalnızca ortam hareket eder.
modeller = ["kling-4", "bytedance-seedance-v2.5", "veo-3.1-fast-generate-001"]  # ElevenLabs'te ücretli plan ister
sure_sn = 10
istem_eki = "Locked-off static camera, no camera movement, no cuts, no zoom. Only gentle, slow ambient motion in the scene; the giant celestial body stays perfectly still in the sky. The last frame returns exactly to the first frame for a seamless loop. Calm, meditative pacing. No text, no people appearing or disappearing, no morphing, no flickering textures."
