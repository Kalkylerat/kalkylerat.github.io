name: Kalkylerat Botu

on:
  schedule:
    # Günün kuponu (dünkü sonuçlar da): hafta içi öğle (akşam maçlarından saatler önce, öğle etkileşim zirvesi),
    # hafta sonu erken (öğleden sonra başlayan maçlar için). Tam saat yerine :47/:17 = GitHub'ın yoğun saatinde gecikme azalır.
    - cron: "47 10 * * 1-5"  # 12:47 İsveç yaz saati (kışın 11:47)
    - cron: "17 8 * * 0,6"   # 10:17 İsveç yaz saati (kışın 09:17)
    # Nabız, 15 dakikada bir: süresi dolan onaylı kuponu paylaşır, biten maçların sonucunu (son maçtan ~15 dk
    # sonra) paylaşır, Pazar akşamı haftalık özeti atar. API isteği yalnızca bitmiş olması gereken maçlar için.
    - cron: "7,22,37,52 * * * *"  # çeyrek başları GitHub'ın en yoğun anı, gecikmesin
  issue_comment:
    types: [created]  # onay isteğine "ok" / "iptal" cevabı
  workflow_dispatch:
    inputs:
      komut:
        description: "Ne yapılsın?"
        type: choice
        default: yayinla
        options: [yayinla, profil, sonuc_yeniden, demo, nabiz, onay_yenile, onay_testi, onay_kontrol, onizleme, duzelt, yenile, sabit, hafta, oran_testi, otomatik, tahmin, sonuc, panel, tani, odds_tani, odds_pazar, vitrin, ek_kupon]
      ek:
        description: "Tek çalışmalık istisna (ör. guvenli_min_deger=-0.03 api_yedek=8); boş bırakın"
        type: string
        default: ""

permissions:
  contents: write
  issues: write


jobs:
  calistir:
    # Yorumlarda yalnızca onay isteklerine tepki verilir.
    # Yalnızca onay isteklerine, sahibinin/üyenin/ortağın yorumlarında (yabancı yorumlar sıradaki işleri iptal edemesin).
    if: >-
      github.event_name != 'issue_comment' ||
      (contains(github.event.issue.labels.*.name, 'onay') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    # İş düzeyinde: atlanan işler (yabancı yorumlar) sıradaki çalışmayı iptal edemez.
    concurrency:
      group: kalkylerat-botu
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Sırada bekleyen çalışma, tetiklendiği andaki değil en güncel kayıtla başlamalı.
      - run: git pull --ff-only origin "$GITHUB_REF_NAME"
      - run: pip install -r requirements.txt
      # Testler hiçbir zaman gerçek onay isteği/önizleme bırakmasın.
      - run: python -m pytest -q
      - run: rm -f onay_istegi.md; git checkout -- docs ornek; git clean -fdq docs/onizleme
      - name: Botu çalıştır
        env:
          OLAY: ${{ github.event_name }}
          ZAMAN: ${{ github.event.schedule }}
          SECIM: ${{ inputs.komut }}
          BOT_EK: ${{ inputs.ek }}
          GH_TOKEN: ${{ github.token }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          case "$OLAY|$ZAMAN" in
            issue_comment\|*) KOMUT=onay_kontrol ;;
            "schedule|7,22,37,52 * * * *") KOMUT=nabiz ;;
            schedule\|*) KOMUT=otomatik ;;
            *) KOMUT="$SECIM" ;;
          esac
          echo "Komut: $KOMUT"
          if [ -z "$API_FOOTBALL_KEY" ] || [ -z "$X_ACCESS_TOKEN" ]; then
            echo "Anahtarlar henüz eklenmemiş (README > Kurulum). Bot çalıştırılmadı." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m bot "$KOMUT"
      - name: Kaydı depoya işle
        if: always()
        run: |
          git config user.name "kalkylerat-botu"
          git config user.email "kalkylerat-botu@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Spel-kaydı $(date -u '+%Y-%m-%d %H:%M') UTC"
          # Tweetler atıldı; kayıt kaybolursa ertesi gün tekrar paylaşım olur. Bu yüzden push mutlaka başarmalı.
          for i in 1 2 3 4 5; do
            # Çakışmada bu çalışmanın kaydı (en güncel olan) korunur.
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "::error::Kayıt depoya gönderilemedi! Çalışmanın 'kayit' dosyasından geri yüklenmeli."
          exit 1
      - name: Onay isteği aç
        if: always() && hashFiles('onay_istegi.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create onay --color 19c37d --description "Paylaşım onayı" --force
          baslik=$(head -n 1 onay_istegi.md)
          tail -n +2 onay_istegi.md > govde.md
          gh issue create --title "$baslik" --label onay --body-file govde.md
      - name: Kayıt yedeği (push başarısız olursa)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kayit
          path: |
            data/
            docs/
